<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OLA小助手</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <div class="app-card">
        <aside class="sidebar">
          <div class="sidebar-top">
            <div class="sidebar-brand">
              <div class="brand-mark small">
                <img src="/assets/logo.png" alt="OLA logo" />
              </div>
              <div class="sidebar-brand-copy">
                <p class="eyebrow">OLA Assistant</p>
                <h2>聊天历史</h2>
              </div>
            </div>
            <button id="new-chat-button" class="secondary-button" type="button">新对话</button>
          </div>
          <section id="conversation-list" class="conversation-list"></section>
        </aside>

        <main class="main-panel">
          <header class="hero">
            <div class="brand-mark">
              <img src="/assets/logo.png" alt="OLA logo" />
            </div>
            <div class="hero-copy">
              <p class="eyebrow">OLA Assistant</p>
              <h1>OLA小助手</h1>
            </div>
          </header>

          <section id="workspace" class="workspace">
            <div class="conversation-panel">
              <section id="chat-log" class="chat-log" aria-live="polite"></section>

              <form id="chat-form" class="composer">
                <label class="sr-only" for="message-input">输入消息</label>
                <textarea
                  id="message-input"
                  name="message"
                  rows="3"
                  placeholder="请输入你想让 OLA 帮你处理的内容..."
                ></textarea>
                <div class="composer-bar">
                  <p id="status-text" class="status-text">本地模式已就绪</p>
                  <button id="send-button" type="submit">发送</button>
                </div>
              </form>
            </div>

            <aside id="progress-panel" class="progress-panel hidden">
              <div class="progress-header">
                <p class="eyebrow">Progress</p>
                <h3>执行进度</h3>
              </div>
              <div id="progress-error" class="progress-error hidden"></div>
              <ol id="progress-list" class="progress-list"></ol>
            </aside>
          </section>
        </main>
      </div>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
